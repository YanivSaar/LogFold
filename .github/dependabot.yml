version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      patch:
        update-types: [patch]
      minor:
        update-types: [minor]
    commit-message:
      prefix: "deps"
    labels:
      - dependencies
      - rust

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    ignore:
      # dtolnay/rust-toolchain uses the Rust toolchain version
      # ("1.75", "stable", ...) as its tag, not a SemVer action
      # version. Dependabot would otherwise churn PRs trying to
      # move our MSRV job to the latest nightly tag.
      - dependency-name: "dtolnay/rust-toolchain"
