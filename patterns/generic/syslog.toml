[meta]
id          = "generic/syslog"
name        = "Generic syslog (fallback)"
category    = "generic"
description = "Lowest-priority fallback — matches any RFC 3164-shaped line"

[detect]
# Deliberately no path hints; this is a content-only fallback.
line_probes = [
  "^\\w{3}\\s+\\d+\\s+\\d{2}:\\d{2}:\\d{2}\\s+\\S+\\s+",
]
probe_threshold = 0.1
