[meta]
id          = "sshd"
name        = "OpenSSH daemon"
category    = "auth"
description = "Covers auth.log / secure lines generated by sshd"

[detect]
path_hints = [
  "**/auth.log*",
  "**/secure*",
  "**/sshd.log*",
  "/var/log/auth*",
  "journald:sshd",
  "journald:openssh*",
]
process_hints = ["sshd", "openssh"]
line_probes = [
  "sshd\\[\\d+\\]:",
  "Accepted (password|publickey|keyboard-interactive)",
  "Failed password for",
  "Invalid user .+ from",
  "Connection closed by",
  "Disconnected from",
]
probe_threshold = 0.15

[parse]
format = "syslog"

[[pattern]]
skeleton = "sshd[*]: Accepted password for {USER} from {IP} port {PORT} ssh2"
label    = "SSH password login"
severity = "medium"

[[pattern]]
skeleton = "sshd[*]: Accepted publickey for {USER} from {IP} port {PORT} ssh2"
label    = "SSH key login"
severity = "info"

[[pattern]]
skeleton = "sshd[*]: Failed password for {USER} from {IP} port {PORT} ssh2"
label    = "SSH brute force attempt"
severity = "low"

[[pattern]]
skeleton = "sshd[*]: Invalid user {USER} from {IP} port {PORT}"
label    = "SSH unknown user probe"
severity = "low"
