# cargo-deny configuration for logfold.
# https://embarkstudios.github.io/cargo-deny/
#
# Policy:
# - Hard-fail on any security advisory from RustSec.
# - Hard-fail on GPL-ish licenses that would taint our MIT crate.
# - Soft-warn on unmaintained / unsound crates we transitively
#   depend on but can't drop without a bigger refactor.

[advisories]
version = 2
# No advisories ignored. The three ratatui-transitive findings
# (paste 1.0.15, lru 0.12.5 x2) that were ignored at v0.1.1
# cleared with the v0.12 ratatui 0.30 upgrade. If any new
# advisory needs a temporary bypass, add it here with a comment
# that names the fix PR.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "0BSD",
]

[[licenses.exceptions]]
# ring uses a custom license file that cargo-deny can't match to
# an SPDX identifier. The license is a mix of MIT/ISC-equivalent
# and OpenSSL-era terms; functionally compatible with MIT.
name = "ring"
allow = ["LicenseRef-ring"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Deny any crate that pulls GPL. We stay permissive.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
