[package]
name         = "logfold"
version      = "0.10.0"
edition      = "2021"
rust-version = "1.75"
description  = "Zero-config log pattern folder and anomaly detector"
license      = "MIT"
repository   = "https://github.com/YanivSaar/LogFold"
homepage     = "https://github.com/YanivSaar/LogFold"
readme       = "README.md"
keywords     = ["logs", "observability", "anomaly-detection", "security", "tui"]
categories   = ["command-line-utilities"]

[dependencies]
tokio             = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "fs", "net", "sync", "signal", "time"] }
ratatui           = { version = "0.27", optional = true }
crossterm         = { version = "0.29", optional = true }
clap              = { version = "4", features = ["derive"] }
dashmap           = "6"
crossbeam-channel = "0.5"
parking_lot       = "0.12"
compact_str       = "0.7"
ahash             = "0.8"
smallvec          = { version = "1", features = ["const_generics"] }
indexmap          = "2"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
toml              = "0.8"
globset           = "0.4"
notify            = { version = "6", optional = true }
regex             = { version = "1", features = ["perf"] }
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
color-eyre        = "0.6"
include_dir       = "0.7"
num_cpus          = "1"
arboard           = { version = "3", optional = true }
reqwest           = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
flate2            = { version = "1", optional = true }
zstd              = { version = "0.13", optional = true }
maxminddb         = { version = "0.24", optional = true }
hyper             = { version = "1", features = ["server", "http1"], optional = true }
hyper-util        = { version = "0.1", features = ["tokio"], optional = true }
http-body-util    = { version = "0.1", optional = true }
bytes             = { version = "1", optional = true }

# v0.5 took the pragmatic path: shelling to `journalctl` rather than
# linking libsystemd. Keeps the Linux build identical to macOS/BSD at
# compile time; distro `journalctl` compatibility is wider than
# `sd-journal` bindings. The journald feature is kept as a no-op
# gate so bundles can still declare `path_hints = ["journald:unit"]`
# as a routing hint.

[features]
default      = ["tui", "watcher"]
tui          = ["dep:ratatui", "dep:crossterm"]
watcher      = ["dep:notify"]
journald     = []
clipboard    = ["dep:arboard"]
webhook      = ["dep:reqwest"]
compression  = ["dep:flate2", "dep:zstd"]
geoip        = ["dep:maxminddb"]
prometheus   = ["dep:hyper", "dep:hyper-util", "dep:http-body-util", "dep:bytes"]

[dev-dependencies]
insta      = { version = "1", features = ["yaml"] }
proptest   = "1"
criterion  = { version = "0.5", features = ["html_reports"] }

[[bench]]
name    = "hot_path"
harness = false

[profile.release]
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = true

[profile.bench]
inherits = "release"
strip    = false
